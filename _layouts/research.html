---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h1 class="h3 fw-bold border-bottom pb-3 mb-5">Research</h1>
    {{ content }}
    {% for research in site.data.settings.research %}
      <section class="mt-4">
        <h2 class="h5"><a href="{{ '/research/' | append: research.url | relative_url }}">{{ research.name }}</a></h2>
        <p>{{ research.description }}</p>
      </section>
    {% endfor %}
  </div>
</div>
